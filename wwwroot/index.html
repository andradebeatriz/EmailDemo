<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enviar e-mail</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:ital,wght@0,100..900;1,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="card">
    <p class="card__eyebrow"><i class="fa-brands fa-optin-monster" aria-hidden="true"></i> Mensageria</p>
    <h1 class="card__title">Enviar e-mail</h1>

    <div class="field">
      <label for="para">Para</label>
      <input id="para" type="email" placeholder="destino@exemplo.com">
    </div>

    <div class="field">
      <label for="assunto">Assunto</label>
      <input id="assunto" type="text" placeholder="Assunto da mensagem">
    </div>

    <div class="field">
      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" rows="5" placeholder="Escreva sua mensagem..."></textarea>
    </div>

    <button id="enviar" class="btn">Enviar</button>
    <div id="status"></div>
  </main>

  <script>
    const btn = document.getElementById('enviar');
    const status = document.getElementById('status');

    // evita que o texto digitado seja interpretado como HTML
    const escapar = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    btn.addEventListener('click', async () => {
      const para = document.getElementById('para').value.trim();
      const assunto = document.getElementById('assunto').value.trim();
      const mensagem = document.getElementById('mensagem').value;

      if (!para || !assunto) {
        status.className = 'erro';
        status.textContent = 'Preencha o destinatário e o assunto.';
        return;
      }

      btn.disabled = true;
      status.className = '';
      status.textContent = 'Enviando...';

      try {
        const resp = await fetch('/api/email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            para,
            assunto,
            corpo: '<p>' + escapar(mensagem).replace(/\n/g, '<br>') + '</p>'
          })
        });

        if (!resp.ok) throw new Error('Erro ' + resp.status);
        status.className = 'ok';
        status.textContent = 'E-mail enviado! Confira o Mailtrap.';
      } catch (e) {
        status.className = 'erro';
        status.textContent = 'Falha ao enviar: ' + e.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
